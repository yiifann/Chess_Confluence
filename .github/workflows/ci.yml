name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime and quality dependencies
        run: python -m pip install -r requirements.txt pytest ruff mypy

      - name: Lint
        run: ruff check --no-cache .

      - name: Check formatting
        run: ruff format --check --no-cache .

      - name: Type check
        run: mypy . --ignore-missing-imports --no-error-summary

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Render the menu and options headlessly
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -c "import pygame; from main import HybridChessGame; game = HybridChessGame(); game.draw(); game.state = 'single_options'; game.draw(); pygame.quit()"
